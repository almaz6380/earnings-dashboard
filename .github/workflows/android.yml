# Baut die Android-App: ein Debug-APK zum Ausprobieren (Artefakt), bei einem Tag v*
# zusätzlich das signierte App-Bundle (AAB) für Google Play.
# Läuft nur bei einem Tag v* oder von Hand (Actions → Android → Run workflow). Früher
# lief er bei jedem Push und jedem Pull Request und hat das Actions-Kontingent des
# Kontos aufgebraucht, obwohl die meisten Änderungen die Android-App nicht betrafen.
# Dafür in den Repository-Secrets hinterlegen:
#   ANDROID_KEYSTORE_BASE64  (base64 -i upload.keystore | tr -d '\n')
#   ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_ALIAS, ANDROID_KEY_PASSWORD
name: Android

on:
  push:
    tags: ['v*']
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 21 }
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4

      - run: npm ci
      - run: npm test
      - run: npm run build
      - run: npx cap sync android
        working-directory: client

      - name: Debug-APK
        run: ./gradlew assembleDebug --no-daemon
        working-directory: client/android
      - uses: actions/upload-artifact@v4
        with:
          name: einnahmen-debug-apk
          path: client/android/app/build/outputs/apk/debug/app-debug.apk

      - name: Signiertes App-Bundle (nur bei Tag v*)
        if: startsWith(github.ref, 'refs/tags/v') && env.KEYSTORE != ''
        env:
          KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          echo "$KEYSTORE" | base64 -d > app/upload.keystore
          ./gradlew bundleRelease --no-daemon \
            -Pandroid.injected.signing.store.file=$PWD/app/upload.keystore \
            -Pandroid.injected.signing.store.password="$KEYSTORE_PASSWORD" \
            -Pandroid.injected.signing.key.alias="$KEY_ALIAS" \
            -Pandroid.injected.signing.key.password="$KEY_PASSWORD"
          rm -f app/upload.keystore
        working-directory: client/android
      - uses: actions/upload-artifact@v4
        if: startsWith(github.ref, 'refs/tags/v') && env.KEYSTORE != ''
        env:
          KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        with:
          name: einnahmen-release-aab
          path: client/android/app/build/outputs/bundle/release/app-release.aab
