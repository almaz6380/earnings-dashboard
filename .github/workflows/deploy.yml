name: Cloudflare veroeffentlichen

# Einnahmen laeuft seit dem 30.09.2026 als Cloudflare Worker (worker/index.js).
# Dieser Workflow testet, baut den Client, veroeffentlicht und uebertraegt die
# Schluessel aus den GitHub-Secrets zu Cloudflare.
#
# Kostenlos: Das Repository ist privat, ein Lauf braucht rund 2 Minuten auf
# ubuntu-latest (Faktor 1, nicht 10 wie macOS). Cloudflare Workers Free kostet nichts.
#
# Noetig als GitHub-Secrets: CLOUDFLARE_API_TOKEN, CLOUDFLARE_ACCOUNT_ID.
# Alles andere ist optional und wird nur uebertragen, wenn es gesetzt ist -
# Liste und Bedeutung: docs/CLOUDFLARE.md.

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: cloudflare
  cancel-in-progress: false

jobs:
  veroeffentlichen:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm test
      - run: npm run build

      # Ein neues Cloudflare-Konto hat noch keine workers.dev-Adresse; ohne sie
      # bricht `wrangler deploy` ab. Einmalig anlegen, danach ist das ein No-op.
      # Die Adresse ist weltweit eindeutig - ist ein Name vergeben, der naechste.
      # Fehlermeldungen von Cloudflare werden ausgegeben (sie enthalten keine Schluessel).
      - name: workers.dev-Adresse sicherstellen
        run: |
          api="https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/subdomain"
          antwort=$(curl -s -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" "$api")
          name=$(echo "$antwort" | jq -r '.result.subdomain // empty')
          if [ -z "$name" ]; then
            echo "Noch keine workers.dev-Adresse: $(echo "$antwort" | jq -c '.errors')"
            for wunsch in almaz6380 almaz6380-apps gallab-apps; do
              neu=$(curl -s -X PUT -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" -H 'content-type: application/json' \
                -d "{\"subdomain\":\"$wunsch\"}" "$api")
              if [ "$(echo "$neu" | jq -r '.success')" = true ]; then name=$wunsch; break; fi
              echo "$wunsch geht nicht: $(echo "$neu" | jq -c '.errors')"
            done
          fi
          if [ -z "$name" ]; then
            echo "::error::Keine workers.dev-Adresse. Im Cloudflare-Dashboard einmal Workers & Pages oeffnen, dann erneut starten."
            exit 1
          fi
          echo "workers.dev-Adresse: $name"
          echo "WORKERS_SUBDOMAIN=$name" >> "$GITHUB_ENV"

      - name: Veroeffentlichen
        run: npx --yes wrangler@4 deploy

      - name: Schluessel uebertragen
        env:
          KV_REST_API_URL: ${{ secrets.KV_REST_API_URL }}
          KV_REST_API_TOKEN: ${{ secrets.KV_REST_API_TOKEN }}
          TOKEN_ENC_KEY: ${{ secrets.TOKEN_ENC_KEY }}
          SESSION_SECRET: ${{ secrets.SESSION_SECRET }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          PUBLIC_URL: ${{ secrets.PUBLIC_URL }}
          APP_ORIGINS: ${{ secrets.APP_ORIGINS }}
          BASE_CURRENCY: ${{ secrets.BASE_CURRENCY }}
          SIGNUP: ${{ secrets.SIGNUP }}
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          REVENUECAT_CLIENT_ID: ${{ secrets.REVENUECAT_CLIENT_ID }}
          REVENUECAT_CLIENT_SECRET: ${{ secrets.REVENUECAT_CLIENT_SECRET }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_BOT_NAME: ${{ secrets.TELEGRAM_BOT_NAME }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          MAIL_FROM: ${{ secrets.MAIL_FROM }}
        run: |
          node scripts/cloudflare-secrets.mjs "$RUNNER_TEMP/secrets.json" \
            KV_REST_API_URL KV_REST_API_TOKEN TOKEN_ENC_KEY SESSION_SECRET CRON_SECRET PUBLIC_URL \
            APP_ORIGINS BASE_CURRENCY SIGNUP GOOGLE_CLIENT_ID GOOGLE_CLIENT_SECRET \
            REVENUECAT_CLIENT_ID REVENUECAT_CLIENT_SECRET TELEGRAM_BOT_TOKEN TELEGRAM_BOT_NAME \
            RESEND_API_KEY MAIL_FROM
          if [ "$(cat "$RUNNER_TEMP/secrets.json")" != "{}" ]; then
            npx --yes wrangler@4 secret bulk "$RUNNER_TEMP/secrets.json"
          fi
          rm -f "$RUNNER_TEMP/secrets.json"

      - name: Gegenprobe
        run: |
          url="https://einnahmen.$WORKERS_SUBDOMAIN.workers.dev"
          # Eine frische workers.dev-Adresse braucht manchmal eine Minute, bis sie antwortet.
          for i in $(seq 1 12); do
            code=$(curl -s -o /dev/null -w '%{http_code}' "$url/api/health" || true)
            # 503 heisst: Worker laeuft, es fehlen nur noch Schluessel (siehe "fehlt").
            { [ "$code" = 200 ] || [ "$code" = 503 ]; } && break
            sleep 10
          done
          echo "api/health: $code"
          curl -s "$url/api/health" | jq '{bereit, fehlt, speicher, speicherErreichbar}'
          {
            echo "## Einnahmen veroeffentlicht"
            echo ""
            echo "- Adresse: $url"
            echo "- Google-OAuth-Weiterleitung: $url/api/google/callback"
            echo "- RevenueCat-Weiterleitung: $url/api/revenuecat/callback"
          } >> "$GITHUB_STEP_SUMMARY"
          [ "$code" = 200 ] || [ "$code" = 503 ]
